<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EAF1"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="2.4" fill="#C3CAD6"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#1B2230" flood-opacity="0.24"/>
    </filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1B2230" flood-opacity="0.28"/>
    </filter>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#dots)" clip-path="url(#tile)" opacity="0.9"/>
  <!-- post-it du fond -->
  <g filter="url(#sh)" transform="rotate(-14 210 250)">
    <rect x="98" y="132" width="224" height="224" rx="16" fill="#9FE3B6"/>
  </g>
  <!-- post-it du milieu -->
  <g filter="url(#sh)" transform="rotate(-5 240 250)">
    <rect x="124" y="118" width="232" height="232" rx="16" fill="#FFDA5C"/>
  </g>
  <!-- post-it du dessus, coin replié -->
  <g filter="url(#sh)" transform="rotate(5 280 270)">
    <path d="M168 136 H372 a16 16 0 0 1 16 16 V316 L332 372 H168 a16 16 0 0 1 -16 -16 V152 a16 16 0 0 1 16 -16 Z" fill="#2F5BFF"/>
    <path d="M388 316 L332 372 V330 a14 14 0 0 1 14 -14 Z" fill="#1E3FC7"/>
    <rect x="190" y="182" width="150" height="20" rx="10" fill="#FFFFFF"/>
    <rect x="190" y="222" width="112" height="20" rx="10" fill="#FFFFFF" opacity="0.78"/>
    <rect x="190" y="262" width="132" height="20" rx="10" fill="#FFFFFF" opacity="0.78"/>
  </g>
  <!-- curseur d'un collègue -->
  <g filter="url(#sh2)" transform="translate(392 352)">
    <path d="M0 0 L66 34 L36 42 L22 72 Z" fill="#FF5A5F" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
  </g>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#1B2230" stroke-opacity="0.10"/>
</svg>
