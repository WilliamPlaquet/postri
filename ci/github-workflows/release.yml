# Construit l'installeur Windows et le publie dans les Releases GitHub.
# Déclenchement : pousser un tag de version, par exemple
#   git tag v1.0.0
#   git push origin v1.0.0
name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: Publier dans la Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Postri-Setup.exe
          generate_release_notes: true
